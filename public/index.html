<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mgrzmil.dev | Status</title>
  <meta name="description" content="Live status of mgrzmil.dev services">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Tokens copied from mgrzmil.dev/style.css */
    :root {
      --primary-color: #ffa652;
      --secondary-color: #333;
      --accent-color: #4a86e8;
      --bg-color: #f9f9f9;
      --text-color: #333;
      --light-gray: #eaeaea;
      --border-radius: 8px;
      --transition: all 0.3s ease;

      --up: #3fb950;
      --degraded: #ffa652;
      --down: #e5534b;
      --empty: #eaeaea;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-color);
    }


    main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }

    .section {
      margin-bottom: 2rem;
      padding: 2rem;
      background-color: white;
      border-radius: var(--border-radius);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
    }

    h1 { font-size: 2rem; margin-bottom: 0.25rem; color: var(--secondary-color); }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      color: var(--secondary-color);
      border-bottom: 3px solid var(--primary-color);
      padding-bottom: 0.5rem;
      display: inline-block;
    }

    .overall { display: flex; align-items: center; gap: 1rem; }
    .overall .dot { width: 1rem; height: 1rem; flex: none; }
    .overall-text { font-size: 1.1rem; font-weight: 500; }
    .info { color: #aaa; text-decoration: none; font-size: 1rem; font-weight: 400; vertical-align: super; transition: var(--transition); }
    .info:hover { color: var(--accent-color); }
    .muted { color: #777; font-size: 0.9rem; }

    .dot { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--empty); }
    .dot.up { background: var(--up); }
    .dot.degraded { background: var(--degraded); }
    .dot.down { background: var(--down); }

    .component {
      border-left: 4px solid var(--primary-color);
      border-radius: var(--border-radius);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      padding: 1rem 1.25rem;
      margin-bottom: 1.75rem;
    }
    .component.down { border-left-color: var(--down); }

    .component-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .component-head h3 { font-size: 1.1rem; font-weight: 600; }
    .component-head a { color: var(--accent-color); text-decoration: none; font-size: 0.85rem; font-weight: 400; margin-left: 0.5rem; }

    .pill {
      background-color: var(--light-gray);
      padding: 0.15rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .bars {
      display: flex;
      gap: 2px;
      height: 32px;
      margin: 0.75rem 0 0.25rem;
    }
    .bars span { flex: 1; min-width: 0; border-radius: 2px; background: var(--empty); }
    .bars span.up { background: var(--up); }
    .bars span.degraded { background: var(--degraded); }
    .bars span.down { background: var(--down); }

    .bars-legend { display: flex; justify-content: space-between; font-size: 0.75rem; color: #888; }

    .err { color: var(--down); font-size: 0.85rem; margin-top: 0.25rem; word-break: break-word; }


    @media (max-width: 600px) {
      .section { padding: 1.25rem; }
      .bars { gap: 1px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="section">
      <h2>Status <a class="info" id="info" href="/api/status" title="Checked every 5 minutes from Cloudflare. Click for raw JSON.">&#9432;</a></h2>
      <div id="components"></div>
    </section>

    <section class="section">
      <div class="overall">
        <span class="dot" id="overall-dot"></span>
        <div>
          <p class="overall-text" id="overall-text">Loading status…</p>
          <p class="muted" id="updated"></p>
        </div>
      </div>
    </section>
  </main>


  <script>
    // Same origin when served by the Worker; override locally with ?api=<url>.
    const API = new URLSearchParams(location.search).get("api") ?? "/api/status";
    const DAYS = 90;
    document.getElementById("info").href = API;

    const COMPONENTS = {
      site: { name: "Portfolio", url: "https://mgrzmil.dev" },
      app: { name: "App", url: "https://app.mgrzmil.dev" },
      api: { name: "API", url: "https://api.mgrzmil.dev/healthcheck" },
      cdn: { name: "Image CDN", url: "https://cdn.mgrzmil.dev" },
      e2e: { name: "End-to-end (API → image)" },
    };

    const LABEL = { up: "Operational", degraded: "Degraded", down: "Down" };

    function el(tag, attrs = {}, ...children) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
      node.append(...children);
      return node;
    }

    function dayStatus(agg) {
      if (!agg) return "";
      if (agg.down > 0) return "down";
      if (agg.degraded > 0) return "degraded";
      return "up";
    }

    function uptime(days) {
      let ok = 0, total = 0;
      for (const d of Object.values(days)) {
        ok += d.up + d.degraded;
        total += d.up + d.degraded + d.down;
      }
      return total ? ((ok / total) * 100).toFixed(2) + "%" : "–";
    }

    function lastDays(n) {
      const keys = [];
      const now = Date.now();
      for (let i = n - 1; i >= 0; i--) keys.push(new Date(now - i * 86400e3).toISOString().slice(0, 10));
      return keys;
    }

    function renderComponent(id, comp) {
      const meta = COMPONENTS[id] ?? { name: id };
      const { status, ms, err } = comp.current;

      const title = el("h3", {}, meta.name);
      if (meta.url) title.append(el("a", { href: meta.url }, new URL(meta.url).host));

      const bars = el("div", { class: "bars" });
      for (const key of lastDays(DAYS)) {
        const agg = comp.days[key];
        const tip = agg
          ? `${key}: ${agg.up} up, ${agg.degraded} degraded, ${agg.down} down, avg ${Math.round(agg.msSum / (agg.up + agg.degraded + agg.down))} ms`
          : `${key}: no data`;
        bars.append(el("span", { class: dayStatus(agg), title: tip }));
      }

      const card = el("div", { class: `component ${status}` },
        el("div", { class: "component-head" },
          title,
          el("span", { class: "pill" }, el("span", { class: `dot ${status}` }), ` ${LABEL[status]} · ${ms} ms`),
        ),
        bars,
        el("div", { class: "bars-legend" },
          el("span", {}, `${DAYS} days ago`),
          el("span", {}, `${uptime(comp.days)} uptime`),
          el("span", {}, "Today"),
        ),
      );
      if (err) card.append(el("p", { class: "err" }, err));
      return card;
    }

    function render(state) {
      const ids = Object.keys(COMPONENTS).filter((id) => state.components[id])
        .concat(Object.keys(state.components).filter((id) => !COMPONENTS[id]));
      const statuses = ids.map((id) => state.components[id].current.status);

      const overall = statuses.includes("down") ? "down" : statuses.includes("degraded") ? "degraded" : "up";
      const text = !ids.length ? "No data yet"
        : overall === "up" ? "All systems operational"
        : overall === "degraded" ? "Some systems degraded"
        : "Some systems are down";

      document.getElementById("overall-dot").className = `dot ${ids.length ? overall : ""}`;
      document.getElementById("overall-text").textContent = text;
      document.getElementById("updated").textContent = state.updated
        ? `Last checked ${new Date(state.updated).toLocaleString()}`
        : "";
      document.getElementById("components").replaceChildren(...ids.map((id) => renderComponent(id, state.components[id])));
    }

    async function load() {
      try {
        const res = await fetch(API, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        render(await res.json());
      } catch (e) {
        document.getElementById("overall-text").textContent = "Status unavailable";
        document.getElementById("updated").textContent = String(e.message ?? e);
      }
    }

    load();
    setInterval(load, 60_000);
  </script>
</body>
</html>
