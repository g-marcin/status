name = "status"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Served only on the custom domain; Wrangler creates the DNS record and cert on deploy.
workers_dev = false
routes = [{ pattern = "status.mgrzmil.dev", custom_domain = true }]

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "STATUS"
id = "a9de89264f11433da487662779eecbc6"

[observability]
enabled = true

# Status page; /api/status falls through to the Worker
[assets]
directory = "./public"

# Check targets. API_URL and CDN_URL are bases without trailing slash.
[vars]
SITE_URL = "https://mgrzmil.dev/"
APP_URL = "https://app.mgrzmil.dev/"
API_URL = "https://api.mgrzmil.dev"
CDN_URL = "https://cdn.mgrzmil.dev"
